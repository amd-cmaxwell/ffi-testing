name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  REPO_OWNER: ${{ vars.REPO_OWNER }}
  REPO_NAME: ${{ vars.REPO_NAME }}
  PKG_SUFFIX: ${{ vars.PKG_SUFFIX }}

jobs:
  detect-changes:
    name: Detect changed FFI crates
    runs-on: ubuntu-latest
    outputs:
      ffi-libs: ${{ steps.diff.outputs.ffi_libs }}
      has-changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed FFI crates since last release
        id: diff
        shell: bash
        run: |
          prev_tag=$(git tag --list 'v*' --sort=-v:refname | head -2 | tail -1)
          changed=()
          for ffi_toml in crates/ffi/*/Cargo.toml; do
            crate_dir=$(basename "$(dirname "$ffi_toml")")
            [ "$crate_dir" = "tools" ] && continue
            [ "$crate_dir" = "types" ] && continue
            cur_ver=$(grep '^version' "$ffi_toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            prev_ver=$(git show "${prev_tag}:${ffi_toml}" 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || echo "")
            if [ "$cur_ver" != "$prev_ver" ]; then
              changed+=("$(echo "$crate_dir" | tr '-' '_')")
            fi
          done
          if [ ${#changed[@]} -gt 0 ]; then
            echo "ffi_libs=${changed[*]}" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "ffi_libs=" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  build-python-bindings:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    uses: ./.github/workflows/build-python-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}
      upload-artifacts: true
      ffi-libs: ${{ needs.detect-changes.outputs.ffi-libs }}

  build-go-bindings:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    uses: ./.github/workflows/build-go-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}
      upload-artifacts: true
      ffi-libs: ${{ needs.detect-changes.outputs.ffi-libs }}

  build-js-bindings:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    uses: ./.github/workflows/build-js-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}
      upload-artifacts: true
      make-target: generate-js
      ffi-libs: ${{ needs.detect-changes.outputs.ffi-libs }}

  publish-bindings:
    name: Publish bindings
    needs: [detect-changes, build-go-bindings, build-python-bindings, build-js-bindings]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive FFI modules
        shell: bash
        run: |
          repo_us=$(echo "$REPO_NAME" | tr '-' '_')
          suffix_us=$(echo "$PKG_SUFFIX" | tr '-' '_')
          echo "REPO_NAME_US=${repo_us}" >> "$GITHUB_ENV"
          echo "PKG_SUFFIX_US=${suffix_us}" >> "$GITHUB_ENV"
          npm_scope=$(make -s -p REPO_NAME=${{ env.REPO_NAME }} PKG_SUFFIX=${{ env.PKG_SUFFIX }} 2>/dev/null | grep '^NPM_SCOPE ' | head -1 | awk '{print $3}')
          echo "NPM_SCOPE=${npm_scope}" >> "$GITHUB_ENV"
          mods=$(sed -n '/^members/,/]/p' Cargo.toml | grep 'crates/ffi/' | sed 's|.*"crates/ffi/\([^"]*\)".*|\1|' | tr '-' '_' | tr '\n' ' ')
          echo "FFI_MODULES=${mods}" >> "$GITHUB_ENV"

      - name: Download Go binding artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/go
          pattern: go-bindings-*
          merge-multiple: true

      - name: Download Python binding artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/python
          pattern: python-bindings-*
          merge-multiple: true

      - name: Download JS binding artifacts
        uses: actions/download-artifact@v4
        with:
          name: js-bindings
          path: bindings/js

      - name: Commit bindings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bindings/go/ bindings/python/
          git add bindings/js/package.json bindings/js/pnpm-workspace.yaml
          git add 'bindings/js/'"${NPM_SCOPE}"'/*/package.json'
          git add 'bindings/js/'"${NPM_SCOPE}"'/*/tsconfig.json'
          git add 'bindings/js/'"${NPM_SCOPE}"'/*/src/'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bindings for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
        shell: bash

      - name: Tag Go modules
        run: |
          for mod in $FFI_MODULES; do
            crate_dir=$(echo "$mod" | tr '_' '-')
            pkg="${REPO_NAME_US}_${mod}${PKG_SUFFIX_US}"
            version=$(grep '^version' "crates/ffi/${crate_dir}/Cargo.toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            tag="bindings/go/${pkg}/v${version}"
            if git rev-parse "${tag}" >/dev/null 2>&1; then
              echo "::error::Tag ${tag} already exists"
              exit 1
            fi
            echo "  tagging ${tag}"
            git tag "${tag}"
          done
          git push origin --tags
        shell: bash

  release:
    name: Publish GitHub Release
    needs: [publish-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: npm-tarballs

      - name: List artifacts
        run: |
          ls -la wheels/
          ls -la npm-tarballs/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wheels/*.whl
            npm-tarballs/*.tgz
          generate_release_notes: true
