name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NPM_SCOPE: "@amd-cmaxwell"

jobs:
  build-python-bindings:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cgo_os: linux
            cgo_arch: amd64
          - os: macos-latest
            cgo_os: darwin
            cgo_arch: arm64
          - os: windows-latest
            cgo_os: windows
            cgo_arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install maturin

      - name: Generate Python bindings
        run: make generate-python CGO_OS=${{ matrix.cgo_os }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: python-bindings-${{ matrix.cgo_os }}-${{ matrix.cgo_arch }}
          path: bindings/python/

      - name: Collect wheels
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wheels"
          find bindings/python -name '*.whl' -exec cp {} "$RUNNER_TEMP/wheels/" \;

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: ${{ runner.temp }}/wheels/*.whl

  build-go-bindings:
    name: Go bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            cgo_os: linux
            cgo_arch: amd64
            lib_suffix: .so
          - os: macos-latest
            cgo_os: darwin
            cgo_arch: arm64
            lib_suffix: .dylib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build FFI crates
        run: cargo build --release

      - name: Generate Go bindings
        run: make generate-go CGO_OS=${{ matrix.cgo_os }} CGO_ARCH=${{ matrix.cgo_arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: go-bindings-${{ matrix.cgo_os }}-${{ matrix.cgo_arch }}
          path: bindings/go/

  build-wasm-bindings:
    name: WASM/TS bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build, compile, and package WASM/JS bindings
        run: make generate-js

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-bindings
          path: bindings/js/

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: dist/npm/*.tgz

  publish-bindings:
    name: Publish bindings
    needs: [build-go-bindings, build-python-bindings, build-wasm-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive FFI modules
        shell: bash
        run: |
          mods=$(sed -n '/^members/,/]/p' Cargo.toml | grep 'crates/ffi/' | sed 's|.*"crates/ffi/\([^"]*\)".*|\1|' | tr '-' '_' | tr '\n' ' ')
          echo "FFI_MODULES=${mods}" >> "$GITHUB_ENV"

      - name: Download Go binding artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/go
          pattern: go-bindings-*
          merge-multiple: true

      - name: Download Python binding artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/python
          pattern: python-bindings-*
          merge-multiple: true

      - name: Download WASM binding artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-bindings
          path: bindings/js

      - name: Commit bindings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bindings/go/ bindings/python/
          git add bindings/js/package.json bindings/js/pnpm-workspace.yaml
          git add 'bindings/js/'"${NPM_SCOPE}"'/*/package.json'
          git add 'bindings/js/'"${NPM_SCOPE}"'/*/tsconfig.json'
          git add 'bindings/js/'"${NPM_SCOPE}"'/*/src/'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bindings for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
        shell: bash

      - name: Tag Go modules
        run: |
          for mod in $FFI_MODULES; do
            crate_dir=$(echo "$mod" | tr '_' '-')
            pkg="uniffi_testing_${mod}_ffi"
            version=$(grep '^version' "crates/ffi/${crate_dir}/Cargo.toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            tag="bindings/go/${pkg}/v${version}"
            if git rev-parse "${tag}" >/dev/null 2>&1; then
              echo "::error::Tag ${tag} already exists"
              exit 1
            fi
            echo "  tagging ${tag}"
            git tag "${tag}"
          done
          git push origin --tags
        shell: bash

  release:
    name: Publish GitHub Release
    needs: [publish-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: npm-tarballs

      - name: List artifacts
        run: |
          ls -la wheels/
          ls -la npm-tarballs/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wheels/*.whl
            npm-tarballs/*.tgz
          generate_release_notes: true
