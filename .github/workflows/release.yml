name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  REPO_OWNER: ${{ vars.REPO_OWNER }}
  REPO_NAME: ${{ vars.REPO_NAME }}
  PKG_SUFFIX: ${{ vars.PKG_SUFFIX }}
  NPM_SCOPE: ${{ vars.NPM_SCOPE }}

jobs:
  detect-changes:
    name: Detect changed crates
    runs-on: ubuntu-latest
    outputs:
      ffi-libs: ${{ steps.diff.outputs.ffi_libs }}
      has-ffi-changes: ${{ steps.diff.outputs.has_ffi_changes }}
      crate-versions: ${{ steps.diff.outputs.crate_versions }}
      has-crate-changes: ${{ steps.diff.outputs.has_crate_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed crates since last release
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          # Look up the most recent tag for a given crate path prefix
          latest_tag_for() {
            local prefix="$1"
            git tag --list "${prefix}/v*" --sort=-v:refname | head -1
          }

          # Extract the version at a given tag, or empty if the tag/file doesn't exist
          version_at_tag() {
            local tag="$1" toml="$2"
            if [ -z "$tag" ]; then
              echo ""
            else
              git show "${tag}:${toml}" 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || echo ""
            fi
          }

          # Pass 1: Library crates — always produce a release when changed
          changed_libs=()
          crate_json="{"
          first=true

          for toml in crates/*/Cargo.toml; do
            [ -f "$toml" ] || continue
            crate_path=$(dirname "$toml")
            crate_dir=$(basename "$crate_path")

            prev_tag=$(latest_tag_for "${crate_path}")
            cur_ver=$(grep '^version' "$toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            prev_ver=$(version_at_tag "$prev_tag" "$toml")

            if [ "$cur_ver" != "$prev_ver" ]; then
              echo "::notice::Library crate changed: ${crate_path} ${prev_ver:-<new>} -> ${cur_ver} (prev tag: ${prev_tag:-none})"
              changed_libs+=("$crate_dir")
              $first || crate_json+=","
              crate_json+="\"${crate_path}\":\"${cur_ver}\""
              first=false
            fi
          done

          # Pass 2: FFI crates — always tracked for binding generation,
          # but only produce a release if the corresponding lib crate didn't change
          ffi_changed=()

          for toml in crates/ffi/*/Cargo.toml; do
            [ -f "$toml" ] || continue
            crate_path=$(dirname "$toml")
            crate_dir=$(basename "$crate_path")
            [ "$crate_dir" = "tools" ] && continue

            prev_tag=$(latest_tag_for "${crate_path}")
            cur_ver=$(grep '^version' "$toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            prev_ver=$(version_at_tag "$prev_tag" "$toml")

            if [ "$cur_ver" != "$prev_ver" ]; then
              ffi_changed+=("$(echo "$crate_dir" | tr '-' '_')")

              # Only add to release map if the lib crate didn't already change
              lib_already_changed=false
              for lib in "${changed_libs[@]}"; do
                if [ "$lib" = "$crate_dir" ]; then
                  lib_already_changed=true
                  break
                fi
              done
              if $lib_already_changed; then
                echo "::notice::FFI crate changed: ${crate_path} ${prev_ver:-<new>} -> ${cur_ver} (covered by lib crate release)"
              else
                echo "::notice::FFI-only crate changed: ${crate_path} ${prev_ver:-<new>} -> ${cur_ver} (prev tag: ${prev_tag:-none})"
                $first || crate_json+=","
                crate_json+="\"${crate_path}\":\"${cur_ver}\""
                first=false
              fi
            fi
          done

          crate_json+="}"

          if [ ${#ffi_changed[@]} -gt 0 ]; then
            echo "ffi_libs=${ffi_changed[*]}" >> "$GITHUB_OUTPUT"
            echo "has_ffi_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No FFI crate version changes detected"
            echo "ffi_libs=" >> "$GITHUB_OUTPUT"
            echo "has_ffi_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "crate_versions=${crate_json}" >> "$GITHUB_OUTPUT"
          if [ "$crate_json" = "{}" ]; then
            echo "::notice::No crate version changes detected"
            echo "has_crate_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::crate-versions=${crate_json}"
            echo "has_crate_changes=true" >> "$GITHUB_OUTPUT"
          fi

  build-python-bindings:
    name: Build Python bindings
    needs: detect-changes
    if: needs.detect-changes.outputs.has-ffi-changes == 'true'
    uses: ./.github/workflows/build-python-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}
      upload-artifacts: true
      ffi-libs: ${{ needs.detect-changes.outputs.ffi-libs }}

  build-go-bindings:
    name: Build Go bindings
    needs: detect-changes
    if: needs.detect-changes.outputs.has-ffi-changes == 'true'
    uses: ./.github/workflows/build-go-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}
      upload-artifacts: true
      ffi-libs: ${{ needs.detect-changes.outputs.ffi-libs }}

  build-js-bindings:
    name: Build JS bindings
    needs: detect-changes
    if: needs.detect-changes.outputs.has-ffi-changes == 'true'
    uses: ./.github/workflows/build-js-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}
      upload-artifacts: true
      make-target: generate-js
      ffi-libs: ${{ needs.detect-changes.outputs.ffi-libs }}

  publish-bindings:
    name: Publish bindings
    needs: [detect-changes, build-go-bindings, build-python-bindings, build-js-bindings]
    if: needs.detect-changes.outputs.has-ffi-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive FFI modules
        shell: bash
        run: |
          set -euo pipefail
          repo_us=$(echo "$REPO_NAME" | tr '-' '_')
          suffix_us=$(echo "$PKG_SUFFIX" | tr '-' '_')
          npm_scope="${NPM_SCOPE:-@${REPO_OWNER}}"
          ffi_modules="${{ needs.detect-changes.outputs.ffi-libs }}"
          echo "REPO_NAME_US=${repo_us}" >> "$GITHUB_ENV"
          echo "PKG_SUFFIX_US=${suffix_us}" >> "$GITHUB_ENV"
          echo "NPM_SCOPE=${npm_scope}" >> "$GITHUB_ENV"
          echo "FFI_MODULES=${ffi_modules}" >> "$GITHUB_ENV"
          echo "::notice::REPO_NAME_US=${repo_us} PKG_SUFFIX_US=${suffix_us} NPM_SCOPE=${npm_scope}"
          echo "::notice::FFI_MODULES=${ffi_modules}"

      - name: Download Go binding artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/go
          pattern: go-bindings-*
          merge-multiple: true

      - name: Download Python binding artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/python
          pattern: python-bindings-*
          merge-multiple: true

      - name: Download JS binding artifacts
        uses: actions/download-artifact@v4
        with:
          name: js-bindings
          path: bindings/js

      - name: Commit FFI bindings
        shell: bash
        env:
          CRATE_VERSIONS: ${{ needs.detect-changes.outputs.crate-versions }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bindings/go/ bindings/python/
          git add bindings/js/package.json bindings/js/pnpm-workspace.yaml
          for pkg_dir in bindings/js/"${NPM_SCOPE}"/*/; do
            [ -d "$pkg_dir" ] || continue
            git add "${pkg_dir}package.json" "${pkg_dir}tsconfig.json" 2>/dev/null || true
            [ -d "${pkg_dir}src" ] && git add "${pkg_dir}src/"
          done
          if git diff --cached --quiet; then
            echo "::warning::No binding changes to commit"
          else
            summary=$(echo "$CRATE_VERSIONS" | jq -r 'to_entries | map("\(.key) v\(.value)") | join(", ")')
            echo "::notice::Committing bindings for: ${summary}"
            git commit -m "chore: Commit FFI bindings for ${summary}"
            git push origin HEAD:main
          fi

      - name: Tag Go modules
        run: |
          set -euo pipefail
          if [ -z "$FFI_MODULES" ]; then
            echo "::warning::FFI_MODULES is empty — no Go module tags to create"
            exit 0
          fi
          for mod in $FFI_MODULES; do
            crate_dir=$(echo "$mod" | tr '_' '-')
            pkg="${REPO_NAME_US}_${mod}${PKG_SUFFIX_US}"
            version=$(grep '^version' "crates/ffi/${crate_dir}/Cargo.toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            tag="bindings/go/${pkg}/v${version}"
            if [ -z "$version" ]; then
              echo "::error::Could not parse version from crates/ffi/${crate_dir}/Cargo.toml"
              exit 1
            fi
            if git rev-parse "${tag}" >/dev/null 2>&1; then
              echo "::error::Tag ${tag} already exists"
              exit 1
            fi
            echo "::notice::Tagging Go module: ${tag}"
            git tag "${tag}"
          done
          git push origin --tags
        shell: bash

  release-rust-crates:
    name: Release Rust crates
    needs: [detect-changes, publish-bindings]
    if: needs.detect-changes.outputs.has-crate-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: npm-tarballs

      - name: Create per-crate releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE_VERSIONS: ${{ needs.detect-changes.outputs.crate-versions }}
        run: |
          set -euo pipefail
          repo_us=$(echo "$REPO_NAME" | tr '-' '_')
          suffix_us=$(echo "$PKG_SUFFIX" | tr '-' '_')
          echo "::notice::Artifact matching patterns — wheels: *\${repo_us}_\${crate_us}\${suffix_us}* | tarballs: *\${REPO_NAME}-\${crate_dir}\${PKG_SUFFIX}*"
          echo "::notice::Available wheels:"
          ls -1 wheels/ 2>/dev/null || echo "::warning::wheels/ directory not found"
          echo "::notice::Available npm tarballs:"
          ls -1 npm-tarballs/ 2>/dev/null || echo "::warning::npm-tarballs/ directory not found"

          tags=()
          for crate_path in $(echo "$CRATE_VERSIONS" | jq -r 'keys[]'); do
            cur_ver=$(echo "$CRATE_VERSIONS" | jq -r --arg k "$crate_path" '.[$k]')
            crate_dir=$(basename "$crate_path")
            tag="${crate_path}/v${cur_ver}"
            if git rev-parse "${tag}" >/dev/null 2>&1; then
              echo "::error::Tag ${tag} already exists"
              exit 1
            fi
            git tag "${tag}"
            git push origin "${tag}"

            crate_us=$(echo "$crate_dir" | tr '-' '_')
            wheel_pattern="${repo_us}_${crate_us}${suffix_us}"
            tarball_pattern="${REPO_NAME}-${crate_dir}${PKG_SUFFIX}"
            assets=()
            while IFS= read -r f; do
              [ -n "$f" ] && assets+=("$f")
            done < <(find wheels/ -name "*${wheel_pattern}*" -type f 2>/dev/null)
            while IFS= read -r f; do
              [ -n "$f" ] && assets+=("$f")
            done < <(find npm-tarballs/ -name "*${tarball_pattern}*" -type f 2>/dev/null)

            if [ ${#assets[@]} -eq 0 ]; then
              echo "::warning::No artifacts matched for ${crate_path} (wheel: *${wheel_pattern}*, tarball: *${tarball_pattern}*)"
            fi
            echo "::notice::Releasing ${tag} with ${#assets[@]} artifact(s): ${assets[*]:-<none>}"
            gh release create "${tag}" "${assets[@]}" \
              --title "${crate_dir} v${cur_ver}" \
              --generate-notes
          done
