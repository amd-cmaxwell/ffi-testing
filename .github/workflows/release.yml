name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            lib_ext: so
          - os: macos-latest
            lib_ext: dylib
          - os: windows-latest
            lib_ext: dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install maturin

      - name: Build Rust library
        run: cargo build --release -p uniffi-testing-ffi

      - name: Generate Python bindings
        run: |
          cargo run --release --bin uniffi-bindgen -- generate \
            --library target/release/libuniffi_testing_ffi.${{ matrix.lib_ext }} \
            --language python --out-dir "$RUNNER_TEMP/uniffi-python-gen"
        shell: bash

      - name: Generate Python submodules
        run: python3 bindings/python/scripts/generate_modules.py "$RUNNER_TEMP/uniffi-python-gen/uniffi_testing_ffi.py"
        shell: bash

      - name: Build wheel
        run: maturin build --release --out "$RUNNER_TEMP/wheels"
        working-directory: bindings/python
        shell: bash

      - name: Smoke test
        run: |
          pip install "$RUNNER_TEMP"/wheels/*.whl
          python examples/demo.py
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: ${{ runner.temp }}/wheels/*.whl

  release:
    name: Publish GitHub Release
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la wheels/

      - uses: softprops/action-gh-release@v2
        with:
          files: wheels/*.whl
          generate_release_notes: true
