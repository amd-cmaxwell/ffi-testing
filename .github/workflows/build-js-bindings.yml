name: Build JS Bindings

on:
  workflow_call:
    inputs:
      repo-owner:
        required: true
        type: string
      repo-name:
        required: true
        type: string
      pkg-suffix:
        required: true
        type: string
      upload-artifacts:
        required: false
        type: boolean
        default: false
      make-target:
        required: false
        type: string
        default: generate-js
      ffi-libs:
        required: false
        type: string
        default: "auto"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-js-bindings:
    name: JS/TS/WASM bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache uniffi-bindgen-react-native
        id: cache-bindgen
        uses: actions/cache@v4
        with:
          path: .tools/bin/uniffi-bindgen-react-native
          key: uniffi-bindgen-rn-${{ runner.os }}-${{ hashFiles('crates/ffi/tools/Cargo.toml') }}

      - name: Install uniffi-bindgen-react-native
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: make build-tools-wasm
        shell: bash

      - name: Add tools to PATH
        run: echo "${{ github.workspace }}/.tools/bin" >> $GITHUB_PATH
        shell: bash

      - name: Build JS/TS/WASM bindings
        run: |
          echo "::notice::Inputs — REPO_OWNER=${{ inputs.repo-owner }} REPO_NAME=${{ inputs.repo-name }} PKG_SUFFIX=${{ inputs.pkg-suffix }} FFI_LIBS=${{ inputs.ffi-libs }}"
          echo "::notice::Make target: ${{ inputs.make-target }}"
          make ${{ inputs.make-target }}
        env:
          REPO_OWNER: ${{ inputs.repo-owner }}
          REPO_NAME: ${{ inputs.repo-name }}
          PKG_SUFFIX: ${{ inputs.pkg-suffix }}
          FFI_LIBS: ${{ inputs.ffi-libs }}

      - name: List generated artifacts
        if: inputs.upload-artifacts
        shell: bash
        run: |
          echo "::group::JS bindings"
          (find bindings/js/ -type f \( -name '*.ts' -o -name '*.js' -o -name 'package.json' \) || true) | head -50 || echo "::warning::No JS bindings found"
          echo "::endgroup::"
          echo "::group::npm tarballs"
          ls -lh dist/npm/*.tgz 2>/dev/null || echo "::warning::No npm tarballs found in dist/npm/"
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: inputs.upload-artifacts
        with:
          name: js-bindings
          path: bindings/js/

      - uses: actions/upload-artifact@v4
        if: inputs.upload-artifacts
        with:
          name: npm-tarballs
          path: dist/npm/*.tgz
