name: Build Go Bindings

on:
  workflow_call:
    inputs:
      repo-owner:
        required: true
        type: string
      repo-name:
        required: true
        type: string
      upload-artifacts:
        required: false
        type: boolean
        default: false
      ffi-libs:
        required: false
        type: string
        default: "auto"
      go-version:
        required: false
        type: string
        default: "1.21"
      python-version:
        required: false
        type: string
        default: "3.12"
      rust-version:
        required: false
        type: string
        default: "stable"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-go-bindings:
    name: Go bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            cgo_os: linux
            cgo_arch: amd64
          - os: macos-latest
            cgo_os: darwin
            cgo_arch: arm64
    steps:
      - name: Set LOG_LEVEL for debug runs
        run: echo "LOG_LEVEL=${{ runner.debug == '1' && '2' || '1' }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache uniffi-bindgen-go
        id: cache-bindgen
        uses: actions/cache@v4
        with:
          path: .tools/bin/uniffi-bindgen-go
          key: uniffi-bindgen-go-${{ runner.os }}-${{ hashFiles('crates/ffi/tools/Cargo.toml') }}

      - name: Install uniffi-bindgen-go
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: make build-tools-go
        shell: bash

      - name: Add tools to PATH
        run: echo "${{ github.workspace }}/.tools/bin" >> $GITHUB_PATH
        shell: bash

      - name: Generate Go bindings
        run: |
          echo "::notice::Inputs — REPO_OWNER=${{ inputs.repo-owner }} REPO_NAME=${{ inputs.repo-name }} FFI_LIBS=${{ inputs.ffi-libs }}"
          echo "::notice::Target — CGO_OS=${{ matrix.cgo_os }} CGO_ARCH=${{ matrix.cgo_arch }}"
          make generate-go
        env:
          REPO_OWNER: ${{ inputs.repo-owner }}
          REPO_NAME: ${{ inputs.repo-name }}
          CGO_OS: ${{ matrix.cgo_os }}
          CGO_ARCH: ${{ matrix.cgo_arch }}
          FFI_LIBS: ${{ inputs.ffi-libs }}
          GO_VERSION: ${{ inputs.go-version }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          RUST_VERSION: ${{ inputs.rust-version }}

      - name: List generated artifacts
        if: inputs.upload-artifacts
        shell: bash
        run: |
          echo "::group::Go bindings"
          (find bindings/go/ -type f \( -name '*.go' -o -name '*.h' -o -name 'go.mod' \) || true) | head -50 || echo "::warning::No Go bindings found"
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: inputs.upload-artifacts
        with:
          name: go-bindings-${{ matrix.cgo_os }}-${{ matrix.cgo_arch }}
          path: bindings/go/
