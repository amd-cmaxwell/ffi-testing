name: Sync FFI Versions

on:
  push:
    branches: [main]
    paths:
      - "crates/*/Cargo.toml"

jobs:
  sync:
    name: Sync FFI crate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync versions
        id: sync
        run: |
          changed=$(./scripts/sync-ffi-versions.sh)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit synced versions
        if: steps.sync.outputs.changed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/ffi/*/Cargo.toml
          git commit -m "chore: sync FFI crate versions"
          git push
