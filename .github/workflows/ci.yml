name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python-bindings:
    name: Python bindings (${{ matrix.os }})
    needs: rust-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            lib_name: libuniffi_testing_ffi.so
          - os: macos-latest
            lib_name: libuniffi_testing_ffi.dylib
          - os: windows-latest
            lib_name: uniffi_testing_ffi.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install maturin

      - name: Build Rust library
        run: cargo build --release -p uniffi-testing-ffi

      - name: Generate Python bindings
        run: |
          cargo run --release --bin uniffi-bindgen -- generate \
            --library target/release/${{ matrix.lib_name }} \
            --language python --out-dir "$RUNNER_TEMP/uniffi-python-gen"
        shell: bash

      - name: Generate Python submodules
        run: python3 bindings/python/scripts/generate_modules.py "$RUNNER_TEMP/uniffi-python-gen/uniffi_testing_ffi.py"
        shell: bash

      - name: Build wheel
        run: maturin build --release --out "$RUNNER_TEMP/wheels"
        working-directory: bindings/python
        shell: bash

      - name: Install and smoke test
        run: |
          pip install "$RUNNER_TEMP"/wheels/*.whl
          python examples/demo.py
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: ${{ runner.temp }}/wheels/*.whl

  go-bindings:
    name: Go bindings (${{ matrix.os }})
    needs: rust-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            lib_name: libuniffi_testing_ffi.so
            cgo_ldflags: "-lm -ldl -lpthread"
          - os: macos-latest
            lib_name: libuniffi_testing_ffi.dylib
            cgo_ldflags: "-lm -lpthread -framework Security -framework Foundation"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Rust library
        run: cargo build --release -p uniffi-testing-ffi

      - name: Generate Go bindings
        run: |
          cargo run --release --bin uniffi-bindgen-go -- \
            --library target/release/${{ matrix.lib_name }} \
            --out-dir "$RUNNER_TEMP/uniffi-go-gen"

      - name: Copy generated files
        run: |
          cp "$RUNNER_TEMP/uniffi-go-gen/uniffi_testing_ffi/uniffi_testing_ffi.go" bindings/go/uniffi_testing_ffi/
          cp "$RUNNER_TEMP/uniffi-go-gen/uniffi_testing_ffi/uniffi_testing_ffi.h" bindings/go/uniffi_testing_ffi/
          cp target/release/libuniffi_testing_ffi.a bindings/go/uniffi_testing_ffi/

      - name: Patch CGo LDFLAGS
        shell: python3 {0}
        env:
          CGO_LDFLAGS_EXTRA: ${{ matrix.cgo_ldflags }}
        run: |
          import os, pathlib
          p = pathlib.Path("bindings/go/uniffi_testing_ffi/uniffi_testing_ffi.go")
          ldflags = os.environ["CGO_LDFLAGS_EXTRA"]
          srcdir = "${SRCDIR}"
          t = p.read_text()
          t = t.replace(
              "// #include <uniffi_testing_ffi.h>",
              f"// #cgo LDFLAGS: -L{srcdir} -luniffi_testing_ffi {ldflags}\n// #include <uniffi_testing_ffi.h>"
          )
          p.write_text(t)

      - name: Generate Go submodules
        run: python3 bindings/go/scripts/generate_modules.py bindings/go/uniffi_testing_ffi/uniffi_testing_ffi.go

      - name: Build Go packages
        run: go build ./...
        working-directory: bindings/go

      - name: Smoke test
        run: go run ./example/demo/
        working-directory: bindings/go
