name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-ffi-coverage:
    name: Check FFI coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check library changes have FFI updates
        run: |
          echo "::notice::Checking FFI coverage: origin/${{ github.base_ref }}...${{ github.sha }}"
          ./scripts/check-ffi-coverage.sh origin/${{ github.base_ref }} ${{ github.sha }}

  check-ffi-versions:
    name: Check FFI crate versions
    uses: ./.github/workflows/check-ffi-versions.yml

  check-workspace-versions:
    name: Check workspace dependency versions
    uses: ./.github/workflows/check-workspace-versions.yml

  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python-bindings:
    name: Build Python Bindings
    needs: [rust-test, check-ffi-versions, check-workspace-versions]
    uses: ./.github/workflows/build-python-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}
      upload-artifacts: true

  go-bindings:
    name: Build Go Bindings
    needs: [rust-test, check-ffi-versions, check-workspace-versions]
    uses: ./.github/workflows/build-go-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}
      upload-artifacts: true

  js-bindings:
    name: Build JS Bindings
    needs: [rust-test, check-ffi-versions, check-workspace-versions]
    uses: ./.github/workflows/build-js-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}
      upload-artifacts: true

  test-python-bindings:
    name: Test Python bindings
    needs: python-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest
          path: dist/pypi/

      - name: Install wheels and run smoke test
        run: |
          python -m venv .venv
          .venv/bin/pip install dist/pypi/*.whl
          .venv/bin/python examples/demo.py

  test-go-bindings:
    name: Test Go bindings
    needs: go-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/download-artifact@v4
        with:
          name: go-bindings-linux-amd64
          path: bindings/go/

      - name: Run smoke test
        run: |
          cd bindings/go
          go run ../../examples/demo.go

  test-js-bindings:
    name: Test JS bindings
    needs: js-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: dist/npm/

      - name: Install tarballs
        run: |
          for tgz in dist/npm/*.tgz; do
            echo "Installing $(basename "$tgz")"
            npm install "$tgz"
          done
          echo "::notice::All npm tarballs installed successfully"
