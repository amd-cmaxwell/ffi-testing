name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FFI_MODULES: types core complex polynomials linear_algebra trig sequences

jobs:
  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python-bindings:
    name: Python bindings (${{ matrix.os }})
    needs: rust-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            lib_prefix: lib
            lib_suffix: .so
          - os: macos-latest
            lib_prefix: lib
            lib_suffix: .dylib
          - os: windows-latest
            lib_prefix: ""
            lib_suffix: .dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build FFI crates
        run: cargo build --release

      - name: Generate Python bindings
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/uniffi-python-gen"
          for mod in $FFI_MODULES; do
            echo "  generating python bindings for $mod"
            cargo run --release -p uniffi-testing-types-ffi --features ffi --bin uniffi-bindgen -- generate \
              --library "target/release/${{ matrix.lib_prefix }}uniffi_testing_${mod}_ffi${{ matrix.lib_suffix }}" \
              --language python --out-dir "$RUNNER_TEMP/uniffi-python-gen"
          done

      - name: Verify generated files
        shell: bash
        run: ls -la "$RUNNER_TEMP/uniffi-python-gen/"

  go-bindings:
    name: Go bindings (${{ matrix.os }})
    needs: rust-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            lib_prefix: lib
            lib_suffix: .so
          - os: macos-latest
            lib_prefix: lib
            lib_suffix: .dylib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build FFI crates
        run: cargo build --release

      - name: Generate Go bindings
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/uniffi-go-gen"
          for mod in $FFI_MODULES; do
            echo "  generating go bindings for $mod"
            cargo run --release -p uniffi-testing-types-ffi --features ffi --bin uniffi-bindgen-go -- \
              --library "target/release/${{ matrix.lib_prefix }}uniffi_testing_${mod}_ffi${{ matrix.lib_suffix }}" \
              --out-dir "$RUNNER_TEMP/uniffi-go-gen"
          done

      - name: Verify generated files
        shell: bash
        run: ls -la "$RUNNER_TEMP/uniffi-go-gen/"
