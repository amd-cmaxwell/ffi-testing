name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-ffi-coverage:
    name: Check FFI coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check library changes have FFI updates
        run: |
          echo "::notice::Checking FFI coverage: origin/${{ github.base_ref }}...${{ github.sha }}"
          ./scripts/check-ffi-coverage.sh origin/${{ github.base_ref }} ${{ github.sha }}

  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python-bindings:
    name: Build Python Bindings
    needs: rust-test
    uses: ./.github/workflows/build-python-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}

  go-bindings:
    name: Build Go Bindings
    needs: rust-test
    uses: ./.github/workflows/build-go-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}

  js-bindings:
    name: Build JS Bindings
    needs: rust-test
    uses: ./.github/workflows/build-js-bindings.yml
    with:
      repo-owner: ${{ vars.REPO_OWNER }}
      repo-name: ${{ vars.REPO_NAME }}
      pkg-suffix: ${{ vars.PKG_SUFFIX }}
