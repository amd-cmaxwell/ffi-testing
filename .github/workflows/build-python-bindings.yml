name: Build Python Bindings

on:
  workflow_call:
    inputs:
      repo-name:
        required: true
        type: string
      pkg-suffix:
        required: true
        type: string
      upload-artifacts:
        required: false
        type: boolean
        default: false
      ffi-libs:
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  python-bindings:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cgo_os: linux
            cgo_arch: amd64
          - os: macos-latest
            cgo_os: darwin
            cgo_arch: arm64
          - os: windows-latest
            cgo_os: windows
            cgo_arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install maturin

      - name: Install uniffi-bindgen
        run: make build-tools-py
        shell: bash

      - name: Add tools to PATH
        run: echo "${{ github.workspace }}/.tools/bin" >> $GITHUB_PATH
        shell: bash

      - name: Generate Python bindings
        run: make generate-python REPO_NAME=${{ inputs.repo-name }} PKG_SUFFIX=${{ inputs.pkg-suffix }} ${{ inputs.ffi-libs && format('FFI_LIBS="{0}"', inputs.ffi-libs) }}
        shell: bash

      # Generated Python source — committed to the repo by the publish-bindings job
      - uses: actions/upload-artifact@v4
        if: inputs.upload-artifacts
        with:
          name: python-bindings-${{ matrix.cgo_os }}-${{ matrix.cgo_arch }}
          path: bindings/python/

      # Compiled wheels — attached to the GitHub Release as downloadable assets
      - uses: actions/upload-artifact@v4
        if: inputs.upload-artifacts
        with:
          name: wheel-${{ matrix.os }}
          path: dist/pypi/*.whl
