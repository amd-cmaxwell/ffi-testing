[package]
name = "uniffi-testing-types-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "uniffi_testing_types_ffi"

[features]
wasm = ["uniffi/wasm-unstable-single-threaded", "uniffi/scaffolding-ffi-buffer-fns", "dep:uniffi-runtime-wasm"]

[dependencies]
uniffi = { version = "0.31" }
uniffi-runtime-wasm = { version = "0.31.0-6", optional = true }
uniffi-testing-core = { path = "../../core" }
