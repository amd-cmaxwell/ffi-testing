[package]
name = "uniffi-testing-polynomials-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "uniffi_testing_polynomials_ffi"

[features]
wasm = ["uniffi/wasm-unstable-single-threaded", "uniffi/scaffolding-ffi-buffer-fns", "dep:uniffi-runtime-wasm", "uniffi-testing-types-ffi/wasm"]

[dependencies]
uniffi = { version = "0.31" }
uniffi-runtime-wasm = { version = "0.31.0-6", optional = true }
uniffi-testing-polynomials = { path = "../../polynomials" }
uniffi-testing-types-ffi = { path = "../types" }
