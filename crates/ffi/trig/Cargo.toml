[package]
name = "uniffi-math-demo-trig-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings for uniffi-math-demo-trig"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "uniffi_math_demo_trig_ffi"

[features]
wasm = ["uniffi/wasm-unstable-single-threaded", "uniffi/scaffolding-ffi-buffer-fns", "dep:uniffi-runtime-wasm", "uniffi-math-demo-types-ffi/wasm"]

[dependencies]
uniffi.workspace = true
uniffi-runtime-wasm = { workspace = true, optional = true }
uniffi-math-demo-trig.workspace = true
uniffi-math-demo-types-ffi.workspace = true
