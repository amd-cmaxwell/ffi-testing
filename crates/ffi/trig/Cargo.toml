[package]
name = "uniffi-testing-trig-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings for uniffi-testing-trig"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "uniffi_testing_trig_ffi"

[features]
wasm = ["uniffi/wasm-unstable-single-threaded", "uniffi/scaffolding-ffi-buffer-fns", "dep:uniffi-runtime-wasm", "uniffi-testing-types-ffi/wasm"]

[dependencies]
uniffi.workspace = true
uniffi-runtime-wasm = { workspace = true, optional = true }
uniffi-testing-trig.workspace = true
uniffi-testing-types-ffi.workspace = true
