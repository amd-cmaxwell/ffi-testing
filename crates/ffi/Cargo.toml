[package]
name = "uniffi-testing-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "uniffi_testing_ffi"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
uniffi-testing-core = { path = "../core" }
uniffi-testing-complex = { path = "../complex" }
uniffi-testing-polynomials = { path = "../polynomials" }
uniffi-testing-linear-algebra = { path = "../linear-algebra" }
uniffi-testing-trig = { path = "../trig" }
uniffi-testing-sequences = { path = "../sequences" }
uniffi-bindgen-go = { git = "https://github.com/NordSecurity/uniffi-bindgen-go", tag = "v0.5.0+v0.29.5" }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-go"
path = "src/bin/uniffi-bindgen-go.rs"
