[package]
name = "uniffi-math-demo-core-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings for uniffi-math-demo-core"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "uniffi_math_demo_core_ffi"

[features]
wasm = ["uniffi/wasm-unstable-single-threaded", "uniffi/scaffolding-ffi-buffer-fns", "dep:uniffi-runtime-wasm"]

[dependencies]
uniffi.workspace = true
uniffi-runtime-wasm = { workspace = true, optional = true }
uniffi-math-demo-core.workspace = true
